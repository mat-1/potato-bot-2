[package]
edition = "2021"
name = "potato-bot-2"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.98"
async-compat = "0.2.4"
azalea = { git = "https://github.com/azalea-rs/azalea" }
azalea-viaversion = { git = "https://github.com/azalea-rs/azalea-viaversion", version = "0.1.0" }
# azalea = { path = "../azalea/azalea" }
bevy_tasks = "0.15.3"
dotenv = "0.15.0"
futures-lite = "2.6.0"
log = "0.4.27"
matrix-sdk = "0.11.0"
parking_lot = { version = "0.12.3", features = ["deadlock_detection"] }
tokio = { version = "1.44.2", features = ["full"] }
twilight-cache-inmemory = "0.16.0"
twilight-gateway = "0.16.0"
twilight-http = "0.16.0"
twilight-model = "0.16.0"
twilight-validate = "0.16.0"

# [profile.dev]
# opt-level = 1
# [profile.dev.package."*"]
# opt-level = 3
